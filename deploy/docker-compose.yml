# Production stack. Copied to /opt/storage-api by GitHub Actions on every deploy;
# never edited by hand on the server.
#
# It never builds: the image is built once in CI and published to GHCR.
# The real .env lives only on the server (/opt/storage-api/.env).
#
# No database here: PostgreSQL is a separate stack (`atm-postgres`) reachable
# through the external network `atm-network`. In DATABASE_URL the host is the
# container name, not localhost.

networks:
  shared:
    name: atm-network
    external: true

services:
  # Applies the pending migrations and exits. `app` does not start until this
  # finishes well, so a broken migration blocks the deploy. The service never
  # migrates by itself at startup.
  migrate:
    image: ghcr.io/atmosferasoltec/atm-storage-api:${IMAGE_TAG:-latest}
    command: ["migrate", "up"]
    env_file: .env
    networks:
      - shared
    restart: "no"

  app:
    image: ghcr.io/atmosferasoltec/atm-storage-api:${IMAGE_TAG:-latest}
    container_name: storage-api
    env_file: .env
    environment:
      APP_ENV: production
      HTTP_PORT: "8084"
    # Loopback only: the host nginx (storage.atmosferast.com) is what publishes it.
    ports:
      - "127.0.0.1:3132:8084"
    networks:
      - shared
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Uploads are spooled to /tmp before going to R2; the root filesystem stays read-only.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
